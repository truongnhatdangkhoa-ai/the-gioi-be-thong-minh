<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8fd3ff">
  <meta name="description" content="Thế Giới Bé Thông Minh - trò chơi học tập vui nhộn cho bé">
  <title>Thế Giới Bé Thông Minh</title>
  <link rel="icon" href="assets/icons/bieu-tuong.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/trang-chu.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="canh-nen" aria-hidden="true">
    <div class="mat-troi-nen"></div>
    <div class="may may-1"></div>
    <div class="may may-2"></div>
    <div class="may may-3"></div>
    <div class="doi doi-1"></div>
    <div class="doi doi-2"></div>
  </div>

  <header id="thanh-trang-thai" class="thanh-trang-thai"></header>

  <main class="trang-chu">
    <section class="dau-trang">
      <div class="nhan-vat">
        <button type="button" class="nut-nhan-vat" id="nut-nhan-vat" aria-label="Gấu Mật - bấm để trò chuyện">
          <svg viewBox="0 0 130 150" aria-hidden="true">
            <ellipse cx="62" cy="142" rx="40" ry="6" fill="rgba(43,35,80,.15)"/>
            <ellipse cx="62" cy="112" rx="38" ry="32" fill="#d8955e"/>
            <ellipse cx="62" cy="118" rx="22" ry="20" fill="#f6d7b5"/>
            <ellipse cx="36" cy="138" rx="14" ry="8" fill="#c77f47"/>
            <ellipse cx="88" cy="138" rx="14" ry="8" fill="#c77f47"/>
            <ellipse cx="26" cy="108" rx="10" ry="16" fill="#c77f47" transform="rotate(20 26 108)"/>
            <g class="tay-vay"><ellipse cx="104" cy="86" rx="10" ry="17" fill="#c77f47" transform="rotate(-25 104 86)"/></g>
            <circle cx="30" cy="22" r="16" fill="#d8955e"/><circle cx="30" cy="22" r="8" fill="#f6c9a0"/>
            <circle cx="94" cy="22" r="16" fill="#d8955e"/><circle cx="94" cy="22" r="8" fill="#f6c9a0"/>
            <circle cx="62" cy="54" r="42" fill="#e3a46c"/>
            <ellipse cx="62" cy="70" rx="21" ry="16" fill="#f6d7b5"/>
            <circle cx="46" cy="48" r="6" fill="#2b2350"/><circle cx="78" cy="48" r="6" fill="#2b2350"/>
            <circle cx="48" cy="46" r="2.2" fill="#fff"/><circle cx="80" cy="46" r="2.2" fill="#fff"/>
            <ellipse cx="62" cy="63" rx="7" ry="5" fill="#2b2350"/>
            <path d="M54 72 Q62 80 70 72" stroke="#2b2350" stroke-width="3" fill="none" stroke-linecap="round"/>
            <circle cx="35" cy="64" r="6" fill="#ff8fa3" opacity=".7"/><circle cx="89" cy="64" r="6" fill="#ff8fa3" opacity=".7"/>
            <path d="M52 100 L62 108 L72 100 Z" fill="#ff5d8f"/><circle cx="62" cy="104" r="3" fill="#ffd23f"/>
          </svg>
        </button>
        <p class="bong-thoai" id="loi-chao">Chào bé! Hôm nay mình chơi gì nhé? 🎈</p>
      </div>
      <h1 class="logo">
        <span class="dong dong-1">Thế Giới</span>
        <span class="dong dong-2">Bé</span>
        <span class="dong dong-3">Thông Minh</span>
      </h1>
    </section>

    <h2 class="tieu-de-khu">Chọn trò chơi 👇</h2>
    <nav class="luoi-tro-choi" id="luoi-tro-choi" aria-label="Các trò chơi"></nav>

    <section class="nhom-nut-trang-chu">
      <button type="button" class="nut nut-vang" id="nut-thanh-tich">🏆 Thành tích</button>
      <button type="button" class="nut nut-trang" id="nut-cai-dat">⚙️ Cài đặt</button>
    </section>
  </main>

  <noscript><p style="text-align:center;font-weight:800">Bé cần bật JavaScript để chơi nhé!</p></noscript>

  <script src="js/luu-tru.js"></script>
  <script src="js/am-thanh.js"></script>
  <script src="js/nhac-nen.js"></script>
  <script src="js/diem-so.js"></script>
  <script src="js/thanh-tich.js"></script>
  <script src="js/app.js"></script>
  <script src="js/anh.js"></script>
  <script src="js/trang-chu.js"></script>
  <script>TrangChu.khoiTao();</script>
  <script src="js/cap-nhat.js"></script>
