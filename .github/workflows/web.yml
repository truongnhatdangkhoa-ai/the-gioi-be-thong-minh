name: Deploy Preview (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gom file website vao thu muc _site
        run: |
          mkdir _site
          rsync -a \
            --exclude='_site' --exclude='www' --exclude='android' --exclude='node_modules' \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='package*.json' --exclude='capacitor.config.json' \
            --exclude='dua-len-github.*' --exclude='HUONG-DAN-*' \
            ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
