name: Deploy Preview (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [main, kho-anan]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gom file website vao thu muc _site
        run: |
          mkdir _site
          rsync -a \
            --exclude='_site' --exclude='www' --exclude='android' --exclude='node_modules' \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='package*.json' --exclude='capacitor.config.json' \
            --exclude='dua-len-github.*' --exclude='HUONG-DAN-*' \
            ./ _site/
          touch _site/.nojekyll

      - name: Tao version.json va danh sach file cho offline
        run: |
          cd _site
          node -e "
          const fs=require('fs'),path=require('path');
          const ds=[];
          (function duyet(d){for(const t of fs.readdirSync(d)){const p=path.join(d,t);
            if(fs.statSync(p).isDirectory())duyet(p);else ds.push(p.split(path.sep).join('/'));}})('.');
          const bo=['sw-files.json','version.json','sw.js'];
          fs.writeFileSync('sw-files.json',JSON.stringify(ds.filter(f=>!bo.includes(f)&&!f.endsWith('.nojekyll'))));
          fs.writeFileSync('version.json',JSON.stringify({phienBan:'${{ github.sha }}-${{ github.run_number }}'}));
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
