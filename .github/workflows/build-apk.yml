name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gom file website vao thu muc www
        run: |
          mkdir www
          rsync -a \
            --exclude='www' --exclude='android' --exclude='node_modules' \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='package*.json' --exclude='capacitor.config.json' \
            --exclude='dua-len-github.*' --exclude='HUONG-DAN-*' \
            ./ www/

      - name: Cai Capacitor
        run: npm install

      - name: Tao du an Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tai APK len
        uses: actions/upload-artifact@v4
        with:
          name: the-gioi-be-thong-minh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
