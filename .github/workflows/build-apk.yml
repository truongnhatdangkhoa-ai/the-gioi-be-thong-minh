name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, kho-anan]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gom file website vao thu muc www
        run: |
          mkdir www
          rsync -a \
            --exclude='www' --exclude='android' --exclude='node_modules' \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='package*.json' --exclude='capacitor.config.json' \
            --exclude='dua-len-github.*' --exclude='HUONG-DAN-*' \
            ./ www/


      - name: Tao version.json va danh sach file cho offline
        run: |
          cd www
          node -e "
          const fs=require('fs'),path=require('path');
          const ds=[];
          (function duyet(d){for(const t of fs.readdirSync(d)){const p=path.join(d,t);
            if(fs.statSync(p).isDirectory())duyet(p);else ds.push(p.split(path.sep).join('/'));}})('.');
          const bo=['sw-files.json','version.json','sw.js'];
          fs.writeFileSync('sw-files.json',JSON.stringify(ds.filter(f=>!bo.includes(f)&&!f.endsWith('.nojekyll'))));
          fs.writeFileSync('version.json',JSON.stringify({phienBan:'${{ github.sha }}-${{ github.run_number }}'}));
          "

      - name: Tro APK vao trang GitHub Pages (de tu cap nhat)
        run: |
          node -e "
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          c.server={url:'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/',androidScheme:'https'};
          fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));
          "
          cat capacitor.config.json

      - name: Cai Capacitor
        run: npm install

      - name: Tao du an Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tai APK len
        uses: actions/upload-artifact@v4
        with:
          name: the-gioi-be-thong-minh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
